name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          version: "0.10.2"
      - name: Install OCR engines exercised by scanned-page tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ukr tesseract-ocr-eng
      - run: uv sync --locked --all-extras
      - name: Lint (pyflakes-level rules configured in pyproject.toml)
        run: uv tool run --from ruff==0.17.4 ruff check src scripts tests
      - run: uv run --no-sync pytest -q -n auto --basetemp=${{ runner.temp }}/pytest
      - run: uv run --no-sync python -m compileall -q src
      - run: uv build --out-dir ${{ runner.temp }}/packages
      - name: Audit pinned Python runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --output-file "${{ runner.temp }}/runtime-requirements.txt"
          uv tool run --from pip-audit==2.10.1 pip-audit --requirement "${{ runner.temp }}/runtime-requirements.txt" --disable-pip --require-hashes --progress-spinner off

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node --test tests/js/*.test.mjs

  image:
    needs: [test, js]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # GHCR image names must be lowercase; github.repository may not be.
      - run: echo "IMAGE=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Smoke-test the image before it can be published
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 127.0.0.1:8000:8000 "$IMAGE:${{ github.sha }}"
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/healthz; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then docker logs smoke; exit 1; fi
          # The server process must have dropped root, and must own its data.
          test "$(docker exec smoke stat -c %u /proc/1)" = "10001"
          test "$(docker exec smoke stat -c %u /data/anamna.sqlite3)" = "10001"
          # A fresh volume leads to first-run setup, with its code in the log.
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/setup)" = "200"
          logs="$(docker logs smoke 2>&1)"
          grep -q "First-run setup code:" <<<"$logs"
          # OCR language data the application depends on is present.
          langs="$(docker exec smoke tesseract --list-langs 2>&1)"
          grep -qx ukr <<<"$langs"
          grep -qx eng <<<"$langs"
          # The image's own healthcheck command succeeds.
          docker exec smoke /app/.venv/bin/python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=8).status == 200 else 1)"
          docker rm -f smoke
      - name: Smoke-test the hardened configuration from compose.yaml
        run: |
          set -euo pipefail
          docker run -d --name hardened --read-only --cap-drop ALL \
            --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add DAC_OVERRIDE \
            --security-opt no-new-privileges:true --pids-limit 512 \
            --tmpfs /tmp --tmpfs /app/tmp:uid=10001,gid=10001 \
            -p 127.0.0.1:8001:8000 "$IMAGE:${{ github.sha }}"
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS -o /dev/null http://127.0.0.1:8001/healthz; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then docker logs hardened; exit 1; fi
          test "$(docker exec hardened stat -c %u /proc/1)" = "10001"
          # The OCR scratch directory is writable by the server's own account, nothing else is.
          docker exec -u 10001 hardened sh -c 'touch /app/tmp/probe && rm /app/tmp/probe'
          if docker exec -u 10001 hardened sh -c 'touch /app/probe' 2>/dev/null; then echo "root filesystem is writable"; exit 1; fi
          # No request line reaches the log: the access log would carry guest-link secrets.
          curl -fsS -o /dev/null "http://127.0.0.1:8001/login?probe=secret-marker"
          logs="$(docker logs hardened 2>&1)"
          if grep -q "secret-marker" <<<"$logs"; then echo "access log is on"; exit 1; fi
          docker rm -f hardened
      - name: Publish
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
