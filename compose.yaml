# A minimal deployment. The database and uploaded files live on the named
# volume; the image itself carries no health data.
#
#   docker compose up -d
#   docker compose logs anamna   # shows the one-time first-run setup code
#
# The port is bound to this machine only. Put a TLS-terminating reverse proxy
# or tunnel in front of it before reaching it from anywhere else, and then set
# the two commented variables below (see SECURITY.md).
# For a reproducible deployment pin the image to a commit tag (ghcr.io/maksii/anamna:<sha>) instead of :latest.
services:
  anamna:
    image: ghcr.io/maksii/anamna:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - anamna-data:/data
    environment:
      ANAMNA_LOG_LEVEL: INFO
      # ANAMNA_SECURE_COOKIES: "1"
      # ANAMNA_PUBLIC_URL: https://health.example.com
      # FORWARDED_ALLOW_IPS: "172.18.0.2"   # your reverse proxy's address, so its X-Forwarded-* headers are trusted
      # ANAMNA_ALLOW_ROOT: "1"              # only for a volume that refuses chown (some network shares)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The entrypoint needs these four only while it hands the volume to the
    # unprivileged account; the server itself runs with none.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /tmp
      - /app/tmp:uid=10001,gid=10001
    pids_limit: 512
    stop_grace_period: 30s

volumes:
  anamna-data:
